<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#06101c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Ultimate Football Mobile - original 3D football game for Android" />
  <title>Ultimate Football Mobile</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <div class="boot-splash">
      <div class="boot-logo">⚽</div>
      <div class="boot-title">ULTIMATE FOOTBALL</div>
      <div class="boot-sub">MOBILE</div>
      <div class="boot-hint">Loading…</div>
    </div>
  </div>

  <script>
    // surface any start-up error inside the WebView instead of a black screen
    window.addEventListener('error', function (event) {
      var node = document.createElement('div');
      node.className = 'fatal-error';
      node.textContent = 'Error: ' + (event.message || event.error) +
        (event.filename ? ' @ ' + event.filename.split('/').pop() + ':' + event.lineno : '');
      document.body.appendChild(node);
      setTimeout(function () { node.remove(); }, 8000);
    });
    // keep the WebView from bouncing / zooming while playing
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
  </script>
  <script src="game.bundle.js" defer></script>
</body>
</html>
