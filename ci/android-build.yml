name: Android APK Build

# NOTE: GitHub only reads workflows from .github/workflows/.
# Activate CI once with your own account (repo-owner rights required):
#
#   mkdir -p .github/workflows && cp ci/android-build.yml .github/workflows/ && \
#   git add .github/workflows && git commit -m "ci: enable apk build" && git push
#
# Builds the game web bundle (if needed) and the Android APK.
# Artifacts:
#   - GitHub Actions artifacts (debug + release APK)
#   - APK files are also committed to `artifacts/` on the triggering branch,
#     so `git pull` + open artifacts/ always has the latest installable build.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild web bundle (committed assets are source of truth, refresh just in case)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build || true

      - name: Build Android APKs (debug + release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs into artifacts/
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ultimate-football-mobile.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ultimate-football-mobile-release.apk
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ufm-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Commit APK back to branch
        run: |
          git config user.name "ufm-build-bot"
          git config user.email "ufm-build-bot@users.noreply.github.com"
          git add artifacts
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish APK build [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "APK unchanged — nothing to commit"
          fi
