# ------------------------------------------------------------------------------
# Ultimate Football Mobile - Android APK build
#
# Primary job (no Android SDK required): bundles the game with Node/esbuild and
# builds + signs the APK with the self-contained toolchain in tools/build_apk.sh
# (JDK, aapt2, d8, apksigner and android.jar are downloaded from npm).
#
# The APK is
#   * uploaded as a workflow artifact (Actions -> run -> Artifacts), and
#   * committed back to `artifacts/` so it can be downloaded from the repository
#     without using the Actions UI.
#
# A second, non-blocking job validates the classic Gradle/Android-SDK build for
# people who prefer Android Studio.
#
# To activate: copy this file to `.github/workflows/android-build.yml` (needs a
# token/App with the `workflows` permission) and push.
# ------------------------------------------------------------------------------
name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run the gameplay test suite
        run: npm test

      - name: Bundle the game (web/src -> android assets)
        run: npm run build

      - name: Check the Android shell against the SDK API index
        run: python3 tools/check_android_api.py

      - name: Build + sign the APK (SDK-less npm toolchain)
        run: bash tools/build_apk.sh

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateFootballMobile-release-apk
          path: artifacts/UltimateFootballMobile-release.apk
          if-no-files-found: error

      - name: Publish the APK back into the repository
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "UFM Build Bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -f artifacts/UltimateFootballMobile-release.apk
          if git diff --cached --quiet; then
            echo "APK unchanged - nothing to publish."
          else
            git commit -m "build: publish signed APK ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi

  gradle:
    name: Validate Gradle project (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies and bundle the game
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Assemble with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload the Gradle APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimateFootballMobile-gradle-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
