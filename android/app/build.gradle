plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ufm.ultimatefootball'
    compileSdk 34

    defaultConfig {
        applicationId "com.ufm.ultimatefootball"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Demo signing key committed for convenience.
    // IMPORTANT: generate your own keystore before publishing to Google Play.
    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore.p12')
            storePassword 'ufm2026'
            keyAlias 'ufm'
            keyPassword 'ufm2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // debug builds are auto-signed by Gradle and installable as-is
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game web bundle lives in app/src/main/assets/www (generated by web/scripts/build.mjs)
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
