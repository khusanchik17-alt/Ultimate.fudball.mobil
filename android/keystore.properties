# Signing configuration for the release build.
#
# This is a DEMO keystore that is intentionally committed so that anybody can
# build/flash the same APK. Replace it with your own keystore (and keep it
# private!) before publishing on Google Play - see README "Release signing".
storeFile=../ufm-demo.keystore
storePassword=ufm-demo-pass
keyAlias=ufm
keyPassword=ufm-demo-pass
